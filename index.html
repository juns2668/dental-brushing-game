<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>바스법 & 차터스법 3D 구강위생 시뮬레이터</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { overflow: hidden; background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%); color: #f8fafc; user-select: none; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    /* 공통 패널 스타일 */
    .panel {
      position: absolute;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      z-index: 10;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .panel-title { font-size: 14px; font-weight: 700; color: #38bdf8; letter-spacing: -0.3px; }
    .toggle-btn {
      background: rgba(51, 65, 85, 0.75);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 7px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-btn:hover { background: #38bdf8; color: #0f172a; }
    .panel-body { margin-top: 12px; }
    .panel.collapsed .panel-body { display: none; }

    /* 상단 모드 전환 바 */
    #top-bar { top: 16px; left: 16px; max-width: 540px; }
    .mode-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .mode-btn {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .mode-btn:hover { border-color: #38bdf8; color: #fff; }
    .mode-btn.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border-color: #7dd3fc;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.45);
    }

    /* 좌측 임상 정보 & 플라그 패널 */
    #info-panel { top: 118px; left: 16px; width: 315px; }
    .badge {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
      margin-bottom: 10px;
    }
    .info-text { font-size: 12.5px; line-height: 1.6; color: #cbd5e1; }
    .info-text strong { color: #f8fafc; }
    .plaque-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(148, 163, 184, 0.2); }
    .progress-bar { width: 100%; height: 10px; background: #1e293b; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #facc15, #34d399); transition: width 0.2s; }
